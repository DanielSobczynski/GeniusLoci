<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historyczne Szlaki - Podróż z Jerozolimy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        /* Jasne tło jako margines przed załadowaniem kafelków */
        #map { width: 100%; height: 100%; background: #e5e5e5; }
        
        /* Stylizacja legendy */
        .legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            line-height: 24px;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 13px;
        }
        .legend h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #2b231f;
            border-bottom: 2px solid #8c7a6b;
            padding-bottom: 6px;
        }
        /* Element legendy: Linia trasy */
        .legend i.line {
            width: 24px;
            height: 4px;
            float: left;
            margin-right: 12px;
            margin-top: 10px; /* wyśrodkowanie linii w pionie względem tekstu */
            opacity: 0.9;
            border-radius: 2px;
        }
        /* Element legendy: Punkt toparchii */
        .legend i.point {
            width: 10px;
            height: 10px;
            float: left;
            margin-right: 19px;
            margin-left: 7px;
            margin-top: 7px;
            background: #ff5722;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Odczytanie parametru języka z URL (domyślnie 'pl')
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'pl';

        // 2. Słownik tłumaczeń
        const translations = {
            pl: {
                title: "Historyczne Szlaki - Podróż z Jerozolimy",
                legendTitle: "Czas podróży z Jerozolimy",
                legendSubtitle: "(Podróż piesza, ok. 30 km/dzień)",
                toparchiesLabel: "Stolice toparchii",
                labels: [
                    '1 dzień (do 30 km)', 
                    '2 dni (do 60 km)', 
                    '3 dni (do 90 km)', 
                    '4 dni (do 120 km)', 
                    '5 dni (powyżej 120 km)'
                ],
                popupRouteTitle: "Odcinek szlaku",
                popupDistance: "Odległość od Jerozolimy: do",
                popupKm: "km",
                popupDay: "Dzień podróży:",
                defaultCityName: "Stolica toparchii"
            },
            en: {
                title: "Historical Routes - Journey from Jerusalem",
                legendTitle: "Travel Time from Jerusalem",
                legendSubtitle: "(Walking journey, approx. 30 km/day)",
                toparchiesLabel: "Capitals of toparchies",
                labels: [
                    '1 day (up to 30 km)', 
                    '2 days (up to 60 km)', 
                    '3 days (up to 90 km)', 
                    '4 days (up to 120 km)', 
                    '5 days (over 120 km)'
                ],
                popupRouteTitle: "Route section",
                popupDistance: "Distance from Jerusalem: up to",
                popupKm: "km",
                popupDay: "Day of journey:",
                defaultCityName: "Toparchy capital"
            }
        };

        const t = translations[currentLang] || translations.pl;
        document.title = t.title;

        // 3. Inicjalizacja mapy
        var map = L.map('map').setView([31.7683, 35.2137], 9); 

        // 4. Podkład mapowy (Esri World Topo)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community',
            maxZoom: 18
        }).addTo(map);

        // 5. Funkcje stylizujące
        function getLineColor(km) {
            return km <= 30  ? '#1a9850' : // 1 dzień (Ciemny zielony)
                   km <= 60  ? '#91cf60' : // 2 dni (Jasny zielony)
                   km <= 90  ? '#d9ef8b' : // 3 dni (Żółty)
                   km <= 120 ? '#fc8d59' : // 4 dni (Pomarańczowy)
                               '#d73027';  // 5+ dni (Czerwony)
        }

        function styleLines(feature) {
            var distance = feature.properties.ToCumul_Length || feature.properties.ToBreak || 30;
            
            return {
                color: getLineColor(distance),
                weight: 3.5,
                opacity: 0.85
            };
        }

        function stylePoints(feature, latlng) {
            return L.circleMarker(latlng, {
                radius: 5.5,
                fillColor: "#ff5722",
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 1
            });
        }

        // 6. Ładowanie obu plików GeoJSON jednocześnie za pomocą Promise.all
        Promise.all([
            fetch('jerozolima.geojson').then(res => res.json()),
            fetch('toparchie.geojson').then(res => res.json())
        ])
        .then(([jerozolimaData, toparchieData]) => {
            
            // --- WARSTWA LINIOWA (Podróż) ---
            var routesLayer = L.geoJSON(jerozolimaData, {
                style: styleLines,
                onEachFeature: function(feature, layer) {
                    var distance = feature.properties.ToCumul_Length || feature.properties.ToBreak;
                    
                    if(distance) {
                        var days = Math.ceil(distance / 30);
                        layer.bindPopup('<b>' + t.popupRouteTitle + '</b><br>' + t.popupDistance + ' ' + distance.toFixed(1) + ' ' + t.popupKm + '<br>' + t.popupDay + ' <b>' + days + '</b>');
                    }
                    
                    // Pogrubienie linii po najechaniu kursorem (Hover)
                    layer.on({
                        mouseover: function(e) { e.target.setStyle({ weight: 6, opacity: 1 }); },
                        mouseout: function(e) { routesLayer.resetStyle(e.target); }
                    });
                }
            }).addTo(map);

            // --- WARSTWA PUNKTOWA (Toparchie) ---
            var toparchiesLayer = L.geoJSON(toparchieData, {
                pointToLayer: stylePoints,
                onEachFeature: function(feature, layer) {
                    var cityName = feature.properties.Name || feature.properties.nazwa || t.defaultCityName;
                    layer.bindPopup('<b style="font-size:14px;">' + cityName + '</b>');
                }
            }).addTo(map);

            // Automatyczne wykadrowanie mapy, by objąć całą rozpiętość dróg
            map.fitBounds(routesLayer.getBounds(), { padding: [40, 40] });
        })
        .catch(err => console.error("Błąd ładowania plików GeoJSON: ", err));

        // 7. Dodanie legendy
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            var grades = [0, 30, 60, 90, 120]; 

            div.innerHTML = '<h4>' + t.legendTitle + '<br><small style="color:#666; font-weight:normal;">' + t.legendSubtitle + '</small></h4>';

            // Element punktowy
            div.innerHTML += '<i class="point"></i> ' + t.toparchiesLabel + '<br><br>';

            // Pętla tworząca kolorowe linie w legendzie
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i class="line" style="background:' + getLineColor(grades[i] + 1) + '"></i> ' + t.labels[i] + '<br>';
            }
            return div;
        };

        legend.addTo(map);

        // Zabezpieczenie przed ucięciem kafelków
        setTimeout(function() { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
