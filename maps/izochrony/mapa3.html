<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Dostępności Czasowej</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; background: #1a1a1a; }

        /* Stylizacja profesjonalnej legendy */
        .legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            line-height: 24px;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 13px;
        }
        .legend h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #2b231f; /* Nawiązanie do brandingu Genius Loci */
            border-bottom: 2px solid #8c7a6b;
            padding-bottom: 6px;
        }
        .legend i {
            width: 24px;
            height: 16px;
            float: left;
            margin-right: 12px;
            opacity: 0.8;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Odczytanie parametru języka z URL (domyślnie 'pl')
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'pl';

        // 2. Słownik tłumaczeń
        const translations = {
            pl: {
                title: "Analiza Dostępności Czasowej",
                popupZone: "Strefa dojazdu:",
                popupUpTo: "do",
                popupMin: "min.",
                legendTitle: "Dostępność czasowa",
                legendSubtitle: "(Samochód osobowy)",
                labels: ["do 5 min", "do 10 min", "do 15 min"]
            },
            en: {
                title: "Travel Time Accessibility Analysis",
                popupZone: "Drive zone:",
                popupUpTo: "up to",
                popupMin: "min.",
                legendTitle: "Travel Time Accessibility",
                legendSubtitle: "(Passenger car)",
                labels: ["up to 5 min", "up to 10 min", "up to 15 min"]
            }
        };

        const t = translations[currentLang] || translations.pl;
        document.title = t.title;

        // 3. Inicjalizacja mapy
        var map = L.map('map').setView([50.06, 19.94], 12); 

        // 4. Podkład mapowy (Standardowa mapa OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // 5. Funkcja przypisująca kolory na podstawie czasu (kolumna ToBreak z ArcGIS)
        function getColor(time) {
            return time <= 5  ? '#2ecc71' : // Zielony dla 5 min
                   time <= 10 ? '#f1c40f' : // Żółty dla 10 min
                   time <= 15 ? '#e74c3c' : // Czerwony dla 15 min
                                '#95a5a6';  // Szary dla wartości powyżej
        }

        function styleIsochrones(feature) {
            var timeLimit = feature.properties.ToBreak; 
            
            return {
                fillColor: getColor(timeLimit),
                weight: 1.5,
                color: '#444444',
                opacity: 0.8,
                fillOpacity: 0.4
            };
        }

        // 6. Wczytanie pliku GeoJSON i dodanie interaktywności
        fetch('izochrony.geojson')
            .then(res => res.json())
            .then(data => {
                var isochroneLayer = L.geoJSON(data, {
                    style: styleIsochrones,
                    onEachFeature: function(feature, layer) {
                        var time = feature.properties.ToBreak;
                        layer.bindPopup('<b>' + t.popupZone + '</b> ' + t.popupUpTo + ' ' + time + ' ' + t.popupMin);
                        
                        layer.on({
                            mouseover: function(e) {
                                var currentLayer = e.target;
                                currentLayer.setStyle({ fillOpacity: 0.7, weight: 2 });
                            },
                            mouseout: function(e) {
                                isochroneLayer.resetStyle(e.target);
                            }
                        });
                    }
                }).addTo(map);

                map.fitBounds(isochroneLayer.getBounds(), { padding: [30, 30] });
            })
            .catch(err => console.error("Błąd ładowania pliku GeoJSON: ", err));

        // 7. Dodanie profesjonalnej legendy
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend'),
                grades = [0, 5, 10];

            div.innerHTML = '<h4>' + t.legendTitle + '<br><small style="color:#666; font-weight:normal;">' + t.legendSubtitle + '</small></h4>';

            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' + t.labels[i] + '<br>';
            }
            return div;
        };

        legend.addTo(map);

        setTimeout(function() { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
