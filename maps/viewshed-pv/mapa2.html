<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Widoczności PV</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; background: #222222; } /* Ciemne tło, aby wyeksponować NMT */

        /* Stylizacja okienka legendy */
        .legend {
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 16px;
            line-height: 20px;
            color: #222;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 13px;
        }
        .legend h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .legend-key-line {
            display: inline-block;
            width: 22px;
            height: 0px;
            border-bottom: 2px dashed #000;
            margin-right: 10px;
        }
        .legend-key-pv {
            display: inline-block;
            width: 22px;
            height: 12px;
            background: #2b6cb0;
            border: 1px solid #1a365d;
            margin-right: 10px;
            border-radius: 2px;
        }
        /* Gradient widoczności: Zielony -> Żółty -> Czerwony */
        .visibility-gradient {
            height: 12px;
            width: 100%;
            background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c);
            border-radius: 3px;
            margin: 4px 0;
            border: 1px solid #ccc;
        }
        .visibility-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Inicjalizacja mapy wycentrowana na Twojej inwestycji
        var map = L.map('map').setView([50.84, 16.15], 11); 

        // 2. Wczytanie RASTRA WIDOCZNOŚCI z NMT
        // WAŻNE: Pierwsza wartość to Szerokość (Lat ~50.x), druga to Długość (Lon ~16.x)
        // [[Południowy-Zachód: Szerokość, Długość], [Północny-Wschód: Szerokość, Długość]]
        var imageBounds = [[50.812, 16.125], [50.874, 16.218]]; 
        
        var rasterOverlay = L.imageOverlay('Viewshed_map.png', imageBounds, {
            opacity: 1.0
        }).addTo(map);

        // Wycentrowanie mapy dokładnie na Twoim rastrze (zapobiega przeskakiwaniu)
        map.fitBounds(imageBounds);

        // 3. Wczytanie WEKTORÓW (Granica działki) + AUTOMATYCZNE PRZYBLIŻENIE NA DZIAŁKĘ
        fetch('dzialka.geojson')
            .then(res => res.json())
            .then(data => {
                var dzialkaLayer = L.geoJSON(data, {
                    style: {
                        color: '#000000',
                        weight: 2,
                        dashArray: '5, 5',
                        fill: false
                    }
                }).addTo(map);

                // To ta linijka odpowiada za dopasowanie kadru do granic działki z marginesem 40px:
                map.fitBounds(dzialkaLayer.getBounds(), { padding: [40, 40] });
            });

        // 4. Wczytanie WEKTORÓW (Stoły Fotowoltaiczne)
        fetch('stoly_pv.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#1a365d',
                        fillColor: '#2b6cb0',
                        fillOpacity: 0.85,
                        weight: 1
                    },
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup('<b>Stół fotowoltaiczny</b>');
                    }
                }).addTo(map);
            });

        // 5. Dodanie interaktywnej legendy w prawym dolnym rogu
        var legend = L.control({ position: 'bottomright' });

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Legenda</h4>
                <div class="legend-item">
                    <span class="legend-key-line"></span>
                    <span>Granica inwestycji</span>
                </div>
                <div class="legend-item">
                    <span class="legend-key-pv"></span>
                    <span>Stoły fotowoltaiczne</span>
                </div>
                <div style="margin-top: 10px;">
                    <strong>Zasięg widoczności:</strong>
                    <div class="visibility-gradient"></div>
                    <div class="visibility-labels">
                        <span>Częściowa</span>
                        <span>Całkowita</span>
                    </div>
                </div>
            `;
            return div;
        };

        legend.addTo(map);
    </script>
</body>
</html>
