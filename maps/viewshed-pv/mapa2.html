<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Widoczności PV</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; background: #222222; } /* Ciemne tło, aby wyeksponować NMT */

        /* Stylizacja okienka legendy */
        .legend {
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 16px;
            line-height: 20px;
            color: #222;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 13px;
        }
        .legend h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .legend-key-line {
            display: inline-block;
            width: 22px;
            height: 0px;
            border-bottom: 2px dashed #000;
            margin-right: 10px;
        }
        .legend-key-pv {
            display: inline-block;
            width: 22px;
            height: 12px;
            background: #2b6cb0;
            border: 1px solid #1a365d;
            margin-right: 10px;
            border-radius: 2px;
        }
        /* Gradient widoczności: Zielony -> Żółty -> Czerwony */
        .visibility-gradient {
            height: 12px;
            width: 100%;
            background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c);
            border-radius: 3px;
            margin: 4px 0;
            border: 1px solid #ccc;
        }
        .visibility-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Odczytanie parametru języka z URL (domyślnie 'pl')
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'pl';

        // 2. Słownik tłumaczeń
        const translations = {
            pl: {
                title: "Analiza Widoczności PV",
                pvPopup: "Stół fotowoltaiczny",
                legendTitle: "Legenda",
                legendBoundary: "Granica inwestycji",
                legendPV: "Stoły fotowoltaiczne",
                legendVisibility: "Zasięg widoczności:",
                legendPartial: "Częściowa",
                legendFull: "Całkowita"
            },
            en: {
                title: "PV Visibility Analysis",
                pvPopup: "PV Table Array",
                legendTitle: "Legend",
                legendBoundary: "Investment boundary",
                legendPV: "PV Tables",
                legendVisibility: "Visibility range:",
                legendPartial: "Partial",
                legendFull: "Full"
            }
        };

        const t = translations[currentLang] || translations.pl;
        document.title = t.title;

        // 3. Inicjalizacja mapy
        var map = L.map('map').setView([50.85, 16.176], 14); 

        // 4. Wczytanie RASTRA WIDOCZNOŚCI z NMT
        var imageBounds = [[50.812, 16.125], [50.874, 16.218]]; 
        
        var rasterOverlay = L.imageOverlay('Viewshed_map.png', imageBounds, {
            opacity: 1.0
        }).addTo(map);

        // 5. Wczytanie WEKTORÓW (Granica działki)
        fetch('dzialka.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#000000',
                        weight: 2,
                        dashArray: '5, 5',
                        fill: false
                    }
                }).addTo(map);
            });

        // 6. Wczytanie WEKTORÓW (Stoły Fotowoltaiczne)
        fetch('stoly_pv.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#1a365d',
                        fillColor: '#2b6cb0',
                        fillOpacity: 0.85,
                        weight: 1
                    },
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup('<b>' + t.pvPopup + '</b>');
                    }
                }).addTo(map);
            });

        // 7. Dodanie interaktywnej legendy
        var legend = L.control({ position: 'bottomright' });

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>${t.legendTitle}</h4>
                <div class="legend-item">
                    <span class="legend-key-line"></span>
                    <span>${t.legendBoundary}</span>
                </div>
                <div class="legend-item">
                    <span class="legend-key-pv"></span>
                    <span>${t.legendPV}</span>
                </div>
                <div style="margin-top: 10px;">
                    <strong>${t.legendVisibility}</strong>
                    <div class="visibility-gradient"></div>
                    <div class="visibility-labels">
                        <span>${t.legendPartial}</span>
                        <span>${t.legendFull}</span>
                    </div>
                </div>
            `;
            return div;
        };

        legend.addTo(map);
    </script>
</body>
</html>
