<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Widoczności PV</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Inicjalizacja mapy wycentrowana na Twojej inwestycji
       // 1. Inicjalizacja mapy ze standardowym, jasnym podkładem OpenStreetMap
        var map = L.map('map').setView([50.84, 16.15], 13); 

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 2. Wczytanie RASTRA WIDOCZNOŚCI z NMT (PNG)
        var imageBounds = [[50.812, 16.125], [50.874, 16.218]]; 
        
        L.imageOverlay('Viewshed_map.png', imageBounds, {
            opacity: 0.5
        }).addTo(map);

        // 4. Wczytanie WEKTORÓW (Granica działki)
        fetch('dzialka.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#000000',
                        weight: 2,
                        dashArray: '5, 5', // przerywana linia jak na Twoim zrzucie
                        fill: false
                    }
                }).addTo(map);
            });

        // 5. Wczytanie WEKTORÓW (Stoły Fotowoltaiczne)
        fetch('stoly_pv.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#1a365d',
                        fillColor: '#2b6cb0',
                        fillOpacity: 0.8,
                        weight: 1
                    },
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup('<b>Stół PV</b><br>Moc/Oznaczenie z ArcGIS');
                    }
                }).addTo(map);
            });
    </script>
</body>
</html>
