<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Działki</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Odczytanie parametru języka z URL (domyślnie 'pl')
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'pl';

        // 2. Słownik tłumaczeń
        const translations = {
            pl: {
                title: "Analiza Działki",
                dzialkaPopup: "Granica działki",
                dzialkaLayer: "🟢 Granica działki",
                zalewowePopup: "Strefa zalewowa",
                zalewoweLayer: "💧 Tereny zalewowe",
                osuwiskaPopup: "Teren osuwiskowy",
                osuwiskaLayer: "⚠️ Osuwiska",
                gazPopup: "Sieć gazowa",
                gazLayer: "🟠 Gazociągi",
                pradPopup: "Sieć elektroenergetyczna",
                pradLayer: "🟡 Przewody elektryczne",
                kanPopup: "Kanalizacja sanitarna",
                kanLayer: "🟣 Kanalizacja sanitarna"
            },
            en: {
                title: "Parcel Analysis",
                dzialkaPopup: "Parcel boundary",
                dzialkaLayer: "🟢 Parcel boundary",
                zalewowePopup: "Flood zone",
                zalewoweLayer: "💧 Flood risk areas",
                osuwiskaPopup: "Landslide area",
                osuwiskaLayer: "⚠️ Landslides",
                gazPopup: "Gas grid",
                gazLayer: "🟠 Gas pipelines",
                pradPopup: "Power grid",
                pradLayer: "🟡 Power lines",
                kanPopup: "Sanitary sewer system",
                kanLayer: "🟣 Sanitary sewer"
            }
        };

        const t = translations[currentLang] || translations.pl;
        document.title = t.title;

        // 3. Inicjalizacja mapy
        var map = L.map('map').setView([50.019, 19.817], 17); 

        // 4. Podkład satelitarny
        var satelita = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 5. Kontroler warstw (legenda w prawym górnym rogu)
        var layerControl = L.control.layers(null, null, {collapsed: false}).addTo(map);

        // 6. Wczytywanie i stylowanie warstw GeoJSON

        // GRANICA DZIAŁKI
        fetch('dzialka.geojson').then(r => r.json()).then(data => {
            var dzialkaLayer = L.geoJSON(data, {
                style: { color: '#00e676', weight: 3, fill: false }
            }).bindPopup('<b>' + t.dzialkaPopup + '</b>');
            
            layerControl.addOverlay(dzialkaLayer, t.dzialkaLayer);
            dzialkaLayer.addTo(map);
        });

        // TERENY ZALEWOWE
        fetch('zalewowe.geojson').then(r => r.json()).then(data => {
            var powodzLayer = L.geoJSON(data, {
                style: { color: 'none', fillColor: '#3182bd', fillOpacity: 0.5 }
            }).bindPopup('<b>' + t.zalewowePopup + '</b>');
            
            layerControl.addOverlay(powodzLayer, t.zalewoweLayer);
        });

        // OSUWISKA
        fetch('osuwiska.geojson').then(r => r.json()).then(data => {
            var osuwiskaLayer = L.geoJSON(data, {
                style: { color: '#de2d26', fillColor: '#fc9272', fillOpacity: 0.5, weight: 1, dashArray: '4' }
            }).bindPopup('<b>' + t.osuwiskaPopup + '</b>');
            
            layerControl.addOverlay(osuwiskaLayer, t.osuwiskaLayer);
        });

        // GAZOCIĄGI
        fetch('gaz.geojson').then(r => r.json()).then(data => {
            var gazLayer = L.geoJSON(data, {
                style: { color: '#f39c12', weight: 2 }
            }).bindPopup('<b>' + t.gazPopup + '</b>');
            
            layerControl.addOverlay(gazLayer, t.gazLayer);
        });

        // PRZEWODY ELEKTRYCZNE
        fetch('prad.geojson').then(r => r.json()).then(data => {
            var pradLayer = L.geoJSON(data, {
                style: { color: '#ffeb3b', weight: 3 }
            }).bindPopup('<b>' + t.pradPopup + '</b>');
            
            layerControl.addOverlay(pradLayer, t.pradLayer);
        });

        // KANALIZACJA SANITARNA
        fetch('kanalizacja.geojson').then(r => r.json()).then(data => {
            var kanLayer = L.geoJSON(data, {
                style: { color: '#8e44ad', weight: 2 }
            }).bindPopup('<b>' + t.kanPopup + '</b>');
            
            layerControl.addOverlay(kanLayer, t.kanLayer);
        });

    </script>
</body>
</html>
