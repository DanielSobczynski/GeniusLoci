<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Działki</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Inicjalizacja mapy
        var map = L.map('map').setView([50.020, 19.817], 16); 

        // 2. Podkład satelitarny
        var satelita = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 3. Kontroler warstw (legenda w prawym górnym rogu)
        var layerControl = L.control.layers(null, null, {collapsed: false}).addTo(map);

        // 4. Wczytywanie i stylowanie warstw GeoJSON

        // GRANICA DZIAŁKI (Seledynowa, dodana do legendy)
        fetch('dzialka.geojson').then(r => r.json()).then(data => {
            var dzialkaLayer = L.geoJSON(data, {
                style: { color: '#00e676', weight: 3, fill: false } // Seledynowy kolor
            }).bindPopup('<b>Granica działki</b>');
            
            layerControl.addOverlay(dzialkaLayer, "🟢 Granica działki");
            dzialkaLayer.addTo(map);
        });

        // TERENY ZALEWOWE
        fetch('zalewowe.geojson').then(r => r.json()).then(data => {
            var powodzLayer = L.geoJSON(data, {
                style: { color: 'none', fillColor: '#3182bd', fillOpacity: 0.5 }
            }).bindPopup('<b>Strefa zalewowa</b>');
            
            layerControl.addOverlay(powodzLayer, "💧 Tereny zalewowe");
            powodzLayer.addTo(map);
        });

        // OSUWISKA
        fetch('osuwiska.geojson').then(r => r.json()).then(data => {
            var osuwiskaLayer = L.geoJSON(data, {
                style: { color: '#de2d26', fillColor: '#fc9272', fillOpacity: 0.5, weight: 1, dashArray: '4' }
            }).bindPopup('<b>Teren osuwiskowy</b>');
            
            layerControl.addOverlay(osuwiskaLayer, "⚠️ Osuwiska");
            osuwiskaLayer.addTo(map);
        });

        // GAZOCIĄGI
        fetch('gaz.geojson').then(r => r.json()).then(data => {
            var gazLayer = L.geoJSON(data, {
                style: { color: '#f39c12', weight: 2 }
            }).bindPopup('Sieć gazowa');
            
            layerControl.addOverlay(gazLayer, "🟠 Gazociągi");
        });

        // PRZEWODY ELEKTRYCZNE (Żółte)
        fetch('prad.geojson').then(r => r.json()).then(data => {
            var pradLayer = L.geoJSON(data, {
                style: { color: '#ffeb3b', weight: 3 } // Żółty kolor
            }).bindPopup('Sieć elektroenergetyczna');
            
            layerControl.addOverlay(pradLayer, "🟡 Przewody elektryczne");
        });

        // KANALIZACJA SANITARNA
        fetch('kanalizacja.geojson').then(r => r.json()).then(data => {
            var kanLayer = L.geoJSON(data, {
                style: { color: '#8e44ad', weight: 2 }
            }).bindPopup('Kanalizacja sanitarna');
            
            layerControl.addOverlay(kanLayer, "🟣 Kanalizacja sanitarna");
        });

    </script>
</body>
</html>
